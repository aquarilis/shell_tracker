<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dd1d21">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carburant">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Shell Tracker</title>
</head>
<body>
  <header class="topbar">
    <h1>Carte Shell</h1>
    <div id="lastInfo" class="last-info">&nbsp;</div>
  </header>

  <main>
    <section id="view-entry" class="view active">
      <form id="entryForm" class="card" novalidate>
        <label>Date
          <input type="date" id="date" required>
        </label>
        <label><span>Prix carburant <span class="unit">CHF/L</span></span>
          <input type="text" id="price" inputmode="decimal" autocomplete="off" placeholder="2,15" required>
        </label>
        <label><span>Volume carburant <span class="unit">litres</span></span>
          <input type="text" id="volume" inputmode="decimal" autocomplete="off" placeholder="45,30" required>
        </label>
        <label><span>Consommation <span class="unit">L/100</span></span>
          <input type="text" id="consumption" inputmode="decimal" autocomplete="off" required>
        </label>
        <label><span>Ajustement km <span class="unit">km</span></span>
          <input type="text" id="adjustment" inputmode="numeric" autocomplete="off" placeholder="0">
        </label>

        <dl class="preview">
          <div><dt>Montant</dt><dd id="pvAmount">–</dd></div>
          <div><dt>Delta km</dt><dd id="pvDelta">–</dd></div>
          <div><dt>New km</dt><dd id="pvMileage">–</dd></div>
        </dl>

        <button type="submit" id="submitBtn" class="primary">Enregistrer</button>
      </form>
    </section>

    <section id="view-history" class="view">
      <div class="toolbar">
        <button type="button" id="refreshHistory">Rafraîchir</button>
      </div>
      <div class="card history-chart-card">
        <div class="history-filters">
          <label>Période
            <select id="historyPeriod">
              <option value="current">Cette année</option>
              <option value="previous">L'année dernière</option>
              <option value="all">Toutes les années</option>
            </select>
          </label>
          <label>Regrouper par
            <select id="historyGrouping">
              <option value="month">Mois</option>
              <option value="year">Année</option>
            </select>
          </label>
        </div>
        <p id="historyStatus" class="history-status" role="status">Chargement…</p>
        <div id="historyResults" hidden>
          <div class="chart-legend">
            <span><i class="legend-amount" aria-hidden="true"></i> Montant (CHF)</span>
            <span><i class="legend-volume" aria-hidden="true"></i> Volume (L)</span>
          </div>
          <div id="chartLayout" class="chart-layout">
            <div class="chart-axis" aria-hidden="true">
              <span id="amountAxis"></span><span>0 CHF</span>
            </div>
            <div class="chart-scroll" tabindex="0" aria-label="Graphique de l'historique, défilable horizontalement">
              <div id="historyChart" class="history-chart" aria-label="Valeurs par période"></div>
            </div>
            <div class="chart-axis chart-axis-right" aria-hidden="true">
              <span id="volumeAxis"></span><span>0 L</span>
            </div>
          </div>
          <p id="chartDetail" class="chart-detail" aria-live="polite">Touchez une période pour voir ses valeurs.</p>
          <dl class="history-totals">
            <div><dt>Montant total</dt><dd id="historyAmount"></dd></div>
            <div><dt>Volume total</dt><dd id="historyVolume"></dd></div>
            <div><dt>Nombre de pleins</dt><dd id="historyCount"></dd></div>
          </dl>
        </div>
      </div>
      <details class="history-details">
        <summary id="historySummary">Entrées</summary>
        <ul id="historyList" class="history"></ul>
      </details>
    </section>

    <section id="view-settings" class="view">
      <form id="settingsForm" class="card" novalidate>
        <label>URL de l'API (Apps Script)
          <input type="url" id="apiUrl" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
        </label>
        <label>Token
          <input type="password" id="apiToken" autocomplete="off">
        </label>
        <button type="submit" class="primary">Enregistrer et tester</button>
      </form>
    </section>
  </main>

  <nav class="tabbar">
    <button type="button" data-view="entry" class="active">Saisie</button>
    <button type="button" data-view="history">Historique</button>
    <button type="button" data-view="settings">Réglages</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="history-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
