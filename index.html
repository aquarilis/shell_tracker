<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dd1d21">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carburant">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Shell Tracker</title>
</head>
<body>
  <header class="topbar">
    <h1>Carte Shell</h1>
    <div id="lastInfo" class="last-info">&nbsp;</div>
  </header>

  <main>
    <section id="view-entry" class="view active">
      <form id="entryForm" class="card" novalidate>
        <label>Date
          <input type="date" id="date" required>
        </label>
        <label>Prix carburant <span class="unit">CHF/L</span>
          <input type="text" id="price" inputmode="decimal" autocomplete="off" placeholder="2,15" required>
        </label>
        <label>Volume carburant <span class="unit">litres</span>
          <input type="text" id="volume" inputmode="decimal" autocomplete="off" placeholder="45,30" required>
        </label>
        <label>Consommation <span class="unit">L/100</span>
          <input type="text" id="consumption" inputmode="decimal" autocomplete="off" required>
        </label>
        <label>Ajustement km <span class="unit">km</span>
          <input type="text" id="adjustment" inputmode="numeric" autocomplete="off" placeholder="0">
        </label>

        <dl class="preview">
          <div><dt>Montant</dt><dd id="pvAmount">–</dd></div>
          <div><dt>Delta km</dt><dd id="pvDelta">–</dd></div>
          <div><dt>New km</dt><dd id="pvMileage">–</dd></div>
        </dl>

        <button type="submit" id="submitBtn" class="primary">Enregistrer</button>
      </form>
    </section>

    <section id="view-history" class="view">
      <div class="toolbar">
        <button type="button" id="refreshHistory">Rafraîchir</button>
      </div>
      <ul id="historyList" class="history"></ul>
    </section>

    <section id="view-settings" class="view">
      <form id="settingsForm" class="card" novalidate>
        <label>URL de l'API (Apps Script)
          <input type="url" id="apiUrl" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
        </label>
        <label>Token
          <input type="password" id="apiToken" autocomplete="off">
        </label>
        <button type="submit" class="primary">Enregistrer et tester</button>
      </form>
    </section>
  </main>

  <nav class="tabbar">
    <button type="button" data-view="entry" class="active">Saisie</button>
    <button type="button" data-view="history">Historique</button>
    <button type="button" data-view="settings">Réglages</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
